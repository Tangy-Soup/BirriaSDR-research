        # BirriaSDR
        
        Turn a supported MediaTek USB 3.0 Wi-Fi dongle into an experimental 2.4/5 GHz SDR receiver. This is an experimental script. Use at your own risk.
        
        **Documentation**
        
        - [Installation](https://cyberether.org/docs/installation)
        - [Python setup](https://cyberether.org/docs/python-block#choosing-a-python-runtime)
        
        ## Setup
        
        1. Connect the COMFAST MT7961/MT7921AU dongle (USB ID 3574:6211) through USB 3.0 and disconnect its Wi-Fi connection.
        2. Select **Python 3.11+** in **Settings → Runtime → Python Runtime**, then restart CyberEther after changing it.
        3. Allow the declared Python dependencies to install. Firmware downloads automatically on first use and is verified and cached.
        
        ## Configuration
        
        - **PYTHON:** Leave `PYTHON=None` to use CyberEther's selected interpreter.
        - **CHANNEL:** Change `CHANNEL` near the top of the Python code to tune, then reload. Use the list below for reference.
        - **USE_SUDO:** Linux uses `sudo -n` for the USB worker. With USB permissions configured, set `USE_SUDO=False`. macOS defaults to direct USB access.
        
        ## Wi-Fi channels
        
