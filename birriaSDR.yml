        @contextmanager
        def session(boot=True, firmware_dir=None):
            with open('/tmp/sdr-wifi-3574-6211.lock', 'a') as lock:
                try:
                    fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)
                except BlockingIOError as exc:
                    raise RuntimeError('Another sdr-wifi process owns the dongle') from exc
                with _session(boot, firmware_dir) as dev:
                    yield dev
        
        @contextmanager
        def _session(boot, firmware_dir):
            firmware_dir = Path(firmware_dir or FIRMWARE_DIR)
            if boot:
                for name, expected in FIRMWARE_HASHES.items():
                    if hashlib.sha256((firmware_dir / name).read_bytes()).hexdigest() != expected:
                        raise RuntimeError(f'Unsupported firmware image: {name}')
            devices = list(usb.core.find(find_all=True, idVendor=13684, idProduct=25105))
            if len(devices) != 1:
                raise RuntimeError(f'Expected one 3574:6211 dongle; found {len(devices)}')
            raw = devices[0]
            layout = layout_from_pyusb(raw)
            topology = f'{raw.bus}-' + '.'.join(map(str, raw.port_numbers))
            for net in Path('/sys/class/net').glob('*'):
                path = net / 'device'
                if path.exists() and path.resolve().name.split(':')[0] == topology:
                    if (net / 'operstate').read_text().strip() == 'up':
                        raise RuntimeError(f'{net.name} is in use; refusing to detach it')
            detached = False
            dev = None
            try:
                try:
                    driver_active = raw.is_kernel_driver_active(layout.interface)
                except NotImplementedError:
                    if sys.platform != 'darwin':
                        raise
                    driver_active = False
                if driver_active:
                    if sys.platform == 'darwin':
                        raise RuntimeError('The dongle has an active macOS driver; release it before using libusb')
                    raw.detach_kernel_driver(layout.interface)
                    detached = True
                dev = Mt7921uDevice(usb_id='3574:6211', address=device_address(raw))
                dev.open()
                if dev.chip_id() != 31073:
                    raise RuntimeError('Capture registers are validated only for MT7961 silicon')
                if boot:
                    images = load_firmware(CHIP_MT7921, firmware_dir)
                    dev.bringup(*images, log=lambda msg: print(msg, file=sys.stderr, flush=True))
                yield dev
            finally:
                if dev is not None:
                    try:
                        dev.wfsys_reset()
                    except Exception as exc:
                        print(f'WiFi reset failed: {exc}', file=sys.stderr, flush=True)
                    dev.close()
                if detached:
                    try:
                        raw.attach_kernel_driver(layout.interface)
                    except usb.core.USBError as exc:
                        print(f'Kernel reattach failed: {exc}', file=sys.stderr, flush=True)
                usb.util.dispose_resources(raw)
        
        PDA_FEEDBACK = 278008081
        
        def pda_checksum(data):
            if len(data) % 4:
                raise ValueError('PDA checksum input must contain whole 32-bit words')
            state = 0
            for word, in struct.iter_unpack('<I', data):
                state = state >> 1 ^ ((state & PDA_FEEDBACK).bit_count() & 1) << 31 ^ word
            return state
        
        def patch_ram(patches):
            """Apply (MCU address, expected bytes, replacement bytes) to the pinned image."""
            _, original = load_firmware(CHIP_MT7921, FIRMWARE_DIR)
            if zlib.crc32(original[:-4]) != struct.unpack_from('<I', original, len(original) - 4)[0]:
                raise ValueError('Original container CRC does not match')
            regions = []
            offset = 0
            for r in parse_ram(original)['regions']:
                if pda_checksum(original[offset:offset + r['len']]):
                    raise ValueError('Original region checksum does not match')
                regions.append((offset, r))
                offset += r['len']
            result = bytearray(original)
            touched = set()
            for addr, expected, replacement in patches:
                if not expected or len(expected) != len(replacement):
                    raise ValueError('A patch must replace the same nonzero number of bytes')
                matches = [(offset, r) for offset, r in regions if not r['feature_set'] & FW_FEATURE_NON_DL and r['addr'] <= addr and (addr + len(expected) <= r['addr'] + r['len'] - 16)]
                if len(matches) != 1:
                    raise ValueError(f'Patch is outside a downloaded payload: {addr:#x}')
                offset, r = matches[0]
                file_offset = offset + addr - r['addr']
                if result[file_offset:file_offset + len(expected)] != expected:
                    raise ValueError(f'Patch expected bytes mismatch at {addr:#x}')
                result[file_offset:file_offset + len(expected)] = replacement
                touched.add(offset)
            for offset, r in regions:
                if offset in touched:
                    end = offset + r['len']
                    correction = pda_checksum(result[offset:end])
                    old_tail = struct.unpack_from('<I', result, end - 4)[0]
                    struct.pack_into('<I', result, end - 4, old_tail ^ correction)
                    if pda_checksum(result[offset:end]):
                        raise ValueError('Patched region checksum does not match')
            struct.pack_into('<I', result, len(result) - 4, zlib.crc32(result[:-4]))
            return bytes(result)
        
        NODE = 1118220
        
        CONTROL = 2147618960
        
        PRODUCER = 2147618996
        
        class CaptureError(RuntimeError):
            pass
        
        @dataclass(frozen=True)
        class Event:
            eid: int
            ext: int
            seq: int
            body: bytes
        
        def parse_events(raw):
            """Parse every RX descriptor in one USB transfer, excluding WiFi frames."""
            pos = 0
            while pos < len(raw):
                if not any(raw[pos:pos + 4]) and (not any(raw[pos:])):
                    return
                if pos + 4 > len(raw):
                    raise CaptureError('Truncated USB RX descriptor')
                word = struct.unpack_from('<I', raw, pos)[0]
                length = word & 65535
                if length < 4 or pos + length > len(raw):
                    raise CaptureError('Invalid or truncated USB RX packet')
                packet = raw[pos:pos + length]
                if word >> 27 & 31 == 7 and word >> 16 & 15 != 1:
                    if length < 36:
                        raise CaptureError('Truncated MCU event')
                    yield Event(packet[28], packet[32], packet[29], bytes(packet[36:]))
                pos += (length + 3 & ~3) + 4
                if pos > len(raw):
                    raise CaptureError('Missing USB RX packet trailer')
        
        class USBEventStream:
            """Reassemble RX records that span USB bulk-transfer completions."""
        
            def __init__(self):
                self.pending = bytearray()
        
            def feed(self, data):
                self.pending.extend(data)
                position = 0
                while len(self.pending) - position >= 4:
                    word = struct.unpack_from('<I', self.pending, position)[0]
                    if word == 0:
                        if any(self.pending[position:]):
                            raise CaptureError('Unexpected USB padding before another record')
                        position = len(self.pending)
                        break
                    length = word & 65535
                    if length < 4:
                        raise CaptureError('Invalid USB RX record length')
                    framed_length = (length + 3 & ~3) + 4
                    if len(self.pending) - position < framed_length:
                        break
                    record = bytes(self.pending[position:position + framed_length])
                    yield from parse_events(record)
                    position += framed_length
                del self.pending[:position]
        
            def finish(self):
                if self.pending:
                    raise CaptureError('Truncated final USB RX record')
        
        class Receiver:
            """Receiver on an already booted, exclusively owned userspace USB device."""
        
            def __init__(self, dev, channel=1):
                if channel not in range(1, 12) and channel not in (36, 40, 44, 48, 149, 153, 157, 161, 165):
                    raise ValueError('Use channel 1–11, 36/40/44/48, or 149/153/157/161/165')
                self.dev = dev
                self.channel = channel
                self.frequency = (2407 + 5 * channel if channel <= 11 else 5000 + 5 * channel) * 1000000
                self.ready = False
                self.index = 0
        
            def events(self, seconds):
                deadline = time.monotonic() + seconds
                while time.monotonic() < deadline:
                    try:
                        raw = self.dev.rx_read(timeout=50, size=65536)
                    except usb.core.USBTimeoutError:
                        continue
                    for event in parse_events(raw):
                        if event.ext == 238 or event.eid == 238:
                            raise CaptureError('Firmware reported an exception')
                        yield event
        
            def drain(self, seconds):
                for _ in self.events(seconds):
                    pass
        
            def ce(self, action, function, value=0):
                self.dev.mcu_cmd_word(MCU_CE_CMD(1), struct.pack('<B3xII', action, function, value), wait=False)
                return self.dev.msg_seq
        
            def ext(self, function, words=(), query=False):
                if len(words) > 20:
                    raise ValueError('Capture command has at most 20 words')
                body = struct.pack('<B3xI20I', 1, function, *list(words) + [0] * (20 - len(words)))
                self.dev.mcu_cmd_word(MCU_EXT_CMD(4) | (MCU_CMD_FIELD_QUERY if query else 0), body, wait=False)
                return self.dev.msg_seq
        
            def completed(self, timeout=1.0):
                """Require both hardware completion/end pointer and the matched status."""
                deadline = time.monotonic() + timeout
                while self.dev.rr(CONTROL) & 2:
                    if time.monotonic() >= deadline:
                        raise CaptureError('Capture source did not complete; refusing data retrieval')
                if self.dev.rr(PRODUCER) != 65532:
                    raise CaptureError('Capture producer did not reach the buffer end')
                seq = self.ext(12, query=True)
                for event in self.events(timeout):
                    if event.eid == 237 and event.ext == 4 and (event.seq == seq):
                        if len(event.body) == 68 and struct.unpack_from('<II', event.body) == (12, 1):
                            return
                raise CaptureError('No matching capture-complete status')
        
            def configure(self):
                self.dev.set_monitor_mode()
                self.dev.set_sniffer(True)
                self.dev.tune('2.4GHz' if self.channel <= 11 else '5GHz', self.channel, self.channel, 20)
                self.ce(0, 2)
                self.drain(0.3)
                for function, value in ((104, 0), (106, 1 << 16), (18, self.frequency // 1000), (15, 0), (71, 0), (72, 0), (73, 0), (1, 13), (1, 2)):
                    self.ce(1, function, value)
                    self.drain(0.03)
                self.ext(11, [1, 0, 0, NODE, 256, 256])
                self.drain(0.01)
                self.completed()
                self.ready = True
        
            def stop(self):
                self.ready = False
                self.ce(1, 1, 0)
                self.ce(0, 0)
                self.drain(0.1)
        
        def arm_dense(dev, divider=3, live=False):
            """Arm 256 KiB ICAP SRAM; the MCU exporter starts the capture separately.
        
            Divider 3/2/1/0 clocks the dense writer at nominal 40/80/160/320 MSps.
            Faster than the selected RF source produces held/repeated samples.
            """
            if divider not in range(4):
                raise ValueError('Dense capture divider must be 0..3')
            dev.wr(2147618960, 241)
            dev.wr(2147618968, 0)
            dev.wr(2147618972, 65532)
            dev.rmw(2147619000, 983040, 2617245696)
            dev.rmw(2198524992, 255, 19)
            dev.rmw(2198525000, 268435455, 8389632 | divider << 18)
            dev.rmw(2281738244, 0, 251658240)
            dev.wr(2147618960, 9457 if live else 1265)
        
        class Timeval(C.Structure):
            _fields_ = [('seconds', C.c_long), ('microseconds', C.c_long)]
        
        class AsyncBulk:
        
            def __init__(self, device, endpoint, depth=16, size=65536):
                self.device = device
                self.endpoint = endpoint
                self.depth = depth
                self.size = size
                self.lib = device._ctx.backend.lib
                self.context = device._ctx.backend.ctx
                self.handle = device._ctx.handle.handle
                self.queue = deque()
                self.transfers = []
                self.buffers = []
                self.pending = set()
                self.closing = False
                self.failure = None
                self.completed = 0
                self.bytes_received = 0
                self.high_water = 0
                self.callback = backend._libusb_transfer_cb_fn_p(self._callback)
                self.lib.libusb_cancel_transfer.argtypes = [backend._libusb_transfer_p]
                self.lib.libusb_handle_events_timeout.argtypes = [C.c_void_p, C.POINTER(Timeval)]
        
            def _submit(self, transfer):
                result = self.lib.libusb_submit_transfer(transfer)
                if result:
                    raise RuntimeError(f'libusb submit failed: {result}')
                self.pending.add(C.addressof(transfer.contents))
        
            def _callback(self, transfer):
                self.pending.discard(C.addressof(transfer.contents))
                if self.closing:
                    return
                try:
                    t = transfer.contents
                    if t.status != 0:
                        raise RuntimeError(f'Bulk transfer status {t.status}')
                    if t.actual_length:
                        self.queue.append((time.perf_counter_ns(), C.string_at(t.buffer, t.actual_length)))
                        self.completed += 1
                        self.bytes_received += t.actual_length
                        self.high_water = max(self.high_water, len(self.queue))
                    if len(self.queue) > 4096:
                        raise RuntimeError('USB consumer overrun')
                    self._submit(transfer)
                except Exception as exc:
                    self.failure = exc
        
            def __enter__(self):
                try:
                    for _ in range(self.depth):
                        transfer = self.lib.libusb_alloc_transfer(0)
                        if not transfer:
                            raise MemoryError('libusb transfer allocation failed')
                        self.transfers.append(transfer)
                        buffer = C.create_string_buffer(self.size)
                        self.buffers.append(buffer)
                        t = transfer.contents
                        t.dev_handle = self.handle
                        t.endpoint = self.endpoint
                        t.type = 2
                        t.timeout = 0
                        t.length = self.size
                        t.buffer = C.addressof(buffer)
                        t.callback = self.callback
                        self._submit(transfer)
                    return self
                except BaseException:
                    self.__exit__(None, None, None)
                    raise
        
            def _events(self, seconds):
                tv = Timeval(0, int(seconds * 1000000.0))
                result = self.lib.libusb_handle_events_timeout(self.context, C.byref(tv))
                if result not in (0, -10):
                    raise RuntimeError(f'libusb events failed: {result}')
        
            def read(self, timeout=0.1):
                deadline = time.monotonic() + timeout
                while not self.queue:
                    if self.failure:
                        raise self.failure
                    remaining = deadline - time.monotonic()
                    if remaining <= 0:
                        raise TimeoutError('No asynchronous USB data')
                    self._events(min(0.05, remaining))
                return self.queue.popleft()
        
            @property
            def stats(self):
                return dict(transfers=self.completed, bytes=self.bytes_received, queue_high_water=self.high_water, queued=len(self.queue), error=str(self.failure) if self.failure else 0)
        
            def __exit__(self, *_):
                self.closing = True
                for transfer in self.transfers:
                    if C.addressof(transfer.contents) in self.pending:
                        self.lib.libusb_cancel_transfer(transfer)
                while self.pending:
                    self._events(0.05)
                for transfer in self.transfers:
                    self.lib.libusb_free_transfer(transfer)
                self.transfers.clear()
                self.buffers.clear()
        
        def read(d, address, size):
            if size % 4:
                raise ValueError('Unaligned read length')
            data = bytearray()
            for offset in range(0, size, 64):
                addr = address + offset
                n = min(64, size - offset)
                part = bytes(d.dev.ctrl_transfer(192, 99, addr >> 16, addr & 65535, n, timeout=1000))
                if len(part) != n:
                    raise RuntimeError(f'Short read at {addr:#x}')
                data.extend(part)
            return bytes(data)
        
        class PythonBulk(AsyncBulk):
        
            def __init__(self, *args, **kwargs):
                super().__init__(*args, **kwargs)
                self.ready = threading.Condition()
                self.thread = None
        
            def _callback(self, transfer):
                with self.ready:
                    super()._callback(transfer)
                    self.ready.notify_all()
        
            def _pump(self):
                try:
                    while not self.closing or self.pending:
                        self._events(0.01)
                except Exception as exc:
                    with self.ready:
                        self.failure = exc
                        self.ready.notify_all()
        
            def __enter__(self):
                super().__enter__()
                self.thread = threading.Thread(target=self._pump, name='python-libusb', daemon=True)
                self.thread.start()
                return self
        
            def read(self, timeout=0.1):
                with self.ready:
                    if not self.ready.wait_for(lambda: self.queue or self.failure, timeout):
                        raise TimeoutError('No Python USB data')
                    if self.failure:
                        raise self.failure
                    return self.queue.popleft()
        
            def __exit__(self, *args):
                if self.thread is not None:
                    self.closing = True
                    import ctypes
                    for transfer in self.transfers:
                        if ctypes.addressof(transfer.contents) in self.pending:
                            self.lib.libusb_cancel_transfer(transfer)
                    self.thread.join(3)
                    if self.thread.is_alive():
                        raise RuntimeError('libusb cancellation did not drain; preserving transfer storage')
                return super().__exit__(*args)
        
        FRAME = struct.Struct('<4sIQ')
        
        SAMPLE_RATE = 40000000
        
        CHUNK_SAMPLES = 262144
        
        PACKET_SAMPLES = 2048
        
        PACKET_LIMIT = 2147483647
        
        
        
        # Small volatile MCU patch; hexadecimal strings below are machine-code data.
        PATCH_RECIPE = {'description': 'Serial live raw DMA; 8192 bytes/packet; host-stop support; 750 us poll guard; no '
                        'sample conversion',
         'firmware_sha256': 'c1e189a2a10a5e94c5d380cd6a34b7510d0869603596a60080a5d821befc5a7c',
         'packets': 2147483647,
         'patches': [{'address': 9815968,
                      'expected': '',
                      'replacement': ''},
                     {'address': 9880182,
                      'expected': '',
                      'replacement': ''}]}
        
        def firmware():
            for name, wanted in FIRMWARE_HASHES.items():
                if hashlib.sha256((FIRMWARE_DIR / name).read_bytes()).hexdigest() != wanted:
                    raise CaptureError('Unsupported firmware: ' + name)
            recipe = PATCH_RECIPE
            ram = patch_ram([(p['address'], bytes.fromhex(p['expected']), bytes.fromhex(p['replacement'])) for p in recipe['patches']])
            if hashlib.sha256(ram).hexdigest() != recipe['firmware_sha256'] or recipe['packets'] != PACKET_LIMIT:
                raise CaptureError('Portable producer checksum mismatch')
            patch, _ = load_firmware(CHIP_MT7921, FIRMWARE_DIR)
            return (patch, ram)
        
        def capture(emit, stop, channel=6, seconds=0, report=None):
            """Emit all consecutive raw samples, or fail explicitly. Always restore USB."""
            report = report if report is not None else {}
            receiver = Receiver(None, channel)
            report.update(complete=False, channel=channel, frequency_hz=receiver.frequency, sample_rate_hz=SAMPLE_RATE, receiver_width_mhz=20, capture_bits=14, raw_format='little-endian raw14 Q,I', packets=0, samples=0, delivered_samples=0)
            patch, ram = firmware()
            report['firmware_sha256'] = hashlib.sha256(ram).hexdigest()
            with session(boot=False) as d:
                d.bringup(patch, ram, log=lambda s: print(s, file=sys.stderr, flush=True))
                rx = Receiver(d, channel)
                rx.configure()
                arm_dense(d, divider=3, live=True)
                rx.drain(0.05)
                adapter = struct.unpack('<19I', read(d, 33641744, 76))
                hardware = struct.unpack('<4I', read(d, 1409286912, 16))
                if adapter[0] != hardware[0] or adapter[4] != 4 or adapter[11] != hardware[2]:
                    raise CaptureError('Unexpected firmware DMA adapter layout')
                d.rmw(MT_UDMA_WLCFG_0, 65535, 1 << 21 | 32 << 8 | 100)
                d.rmw(MT_UDMA_WLCFG_1, 255, 30)
                emit(b'META', 0, json.dumps(report).encode())
                framing = USBEventStream()
                chunks = []
                started = False
                stopping = False
                try:
                    with PythonBulk(d.dev, d.ep_in_pkt_rx, depth=128) as stream:
                        start = time.monotonic()
                        try:
                            rx.ext(17, [0, 4, 1, 0, 0, 0], query=True)
                            started = True
                            while True:
                                if (stop.is_set() or (seconds and time.monotonic() - start >= seconds)) and (not stopping):
                                    rx.ext(12, query=True)
                                    stopping = True
                                try:
                                    _, raw = stream.read(0.1)
                                except TimeoutError:
                                    break
                                for event in framing.feed(raw):
                                    if event.eid != 237 or event.ext != 241:
                                        continue
                                    if event.seq or len(event.body) != 8200:
                                        raise CaptureError('Malformed dense DMA event')
                                    index, offset = struct.unpack_from('<II', event.body)
                                    if index != report['packets'] or offset != index * 8192 & 4294967295:
                                        raise CaptureError(f"Lost/duplicated DMA packet at {report['packets']}")
                                    report['packets'] += 1
                                    report['samples'] += PACKET_SAMPLES
                                    chunks.append(event.body[8:])
                                    if len(chunks) == CHUNK_SAMPLES // PACKET_SAMPLES:
                                        emit(b'IQ14', report['delivered_samples'], b''.join(chunks))
                                        report['delivered_samples'] += CHUNK_SAMPLES
                                        chunks.clear()
                            framing.finish()
                            if chunks:
                                data = b''.join(chunks)
                                emit(b'IQ14', report['delivered_samples'], data)
                                report['delivered_samples'] += len(data) // 4
                            report['python_usb'] = stream.stats
                            if stream.stats['error']:
                                raise CaptureError(f'Python USB error: {stream.stats}')
                        except BaseException:
                            if started:
                                rx.ext(12, query=True)
                                deadline = time.monotonic() + 2
                                while time.monotonic() < deadline:
                                    try:
                                        stream.read(0.1)
                                    except (TimeoutError, RuntimeError):
                                        break
                            raise
                        finally:
                            report['host_stream_seconds'] = time.monotonic() - start
                    mailbox = struct.unpack('<4I', read(d, 33784668, 16))
                    report['mailbox'] = list(mailbox)
                    wanted = 9 if stopping else 2
                    if mailbox[0] != wanted or mailbox[1] != report['packets'] or mailbox[3] or (not stopping and report['packets'] != PACKET_LIMIT):
                        raise CaptureError(f'Capture integrity check failed: {mailbox}')
                    rx.stop()
                    report['clean_firmware_handoff'] = True
                except BaseException as exc:
                    report['error'] = repr(exc)
                    raise
            report['complete'] = True
        
        def main():
            sys.setswitchinterval(0.0005)
            if sys.platform.startswith('linux') and os.geteuid() == 0:
                with suppress(OSError):
                    os.nice(-5)
            parser = argparse.ArgumentParser(description=__doc__)
            parser.add_argument('--helper', action='store_true')
            parser.add_argument('--firmware-dir', type=Path)
            parser.add_argument('--channel', type=int, default=6)
            parser.add_argument('--seconds', type=float, default=0)
            parser.add_argument('--report', type=Path)
            parser.add_argument('--ring', type=Path, required=True)
            parser.add_argument('--python-path', action='append', default=[])
            args = parser.parse_args()
            if not 0 <= args.seconds < float('inf'):
                parser.error('seconds must be finite and nonnegative')
            stop = threading.Event()
            credit = threading.Condition()
            acknowledged = 0
            sent = 0
        
            def control():
                nonlocal acknowledged
                pending = bytearray()
                while True:
                    data = os.read(0, 8 - len(pending))
                    if not data:
                        stop.set()
                        with credit:
                            credit.notify_all()
                        return
                    pending.extend(data)
                    if len(pending) != 8:
                        continue
                    value, = struct.unpack('<Q', pending)
                    pending.clear()
                    with credit:
                        if value == 18446744073709551615:
                            stop.set()
                        elif value == acknowledged + 1:
                            acknowledged = value
                        else:
                            stop.set()
                        credit.notify_all()
            threading.Thread(target=control, daemon=True).start()
            for sig in (signal.SIGINT, signal.SIGTERM):
                signal.signal(sig, lambda *_: stop.set())
            out = sys.stdout.buffer
            ring_file = args.ring.open('r+b', buffering=0)
            ring = mmap.mmap(ring_file.fileno(), CHUNK_SAMPLES * 4 * 32)
        
            def emit(kind, sample, data):
                nonlocal sent
                if kind == b'IQ14':
                    with credit:
                        if not credit.wait_for(lambda: sent - acknowledged < 32, timeout=0.5):
                            raise CaptureError('CyberEther shared-memory consumer stalled')
                    offset = sent % 32 * CHUNK_SAMPLES * 4
                    ring[offset:offset + len(data)] = data
                    out.write(FRAME.pack(kind, len(data), sample))
                    sent += 1
                    out.flush()
                    return
                out.write(FRAME.pack(kind, len(data), sample))
                out.write(data)
                out.flush()
            report = {}
            status = 0
            try:
                capture(emit, stop, args.channel, args.seconds, report)
            except Exception as exc:
                report.update(complete=False, error=str(exc))
                print('MT7961: ' + str(exc), file=sys.stderr, flush=True)
                status = 1
            finally:
                if args.report:
                    args.report.write_text(json.dumps(report, indent=2) + '\n')
                try:
                    emit(b'DONE', report.get('samples', 0), json.dumps(report).encode())
                except (BrokenPipeError, OSError):
                    pass
                print('MT7961 result: ' + json.dumps(report), file=sys.stderr, flush=True)
                ring.close()
                ring_file.close()
            return status
        
        def complex_samples(raw):
            """Preserve all 14 captured bits; exact binary normalization into CF32."""
            if not raw or len(raw) % 16:
                raise ValueError('Incomplete dense I/Q beat')
            words = np.frombuffer(raw, dtype='<u2').reshape(-1, 2)
            if np.any(words & 49152):
                raise ValueError('I/Q component exceeds the raw14 format')
            signed = (words ^ 8192).astype(np.int16) - np.int16(8192)
            out = np.empty(len(words), dtype=np.complex64)
            np.multiply(signed[:, 1], np.float32(1 / 8192), out=out.real)
            np.multiply(signed[:, 0], np.float32(1 / 8192), out=out.imag)
            return out
        
        class Source:
        
            def __init__(self, channel=6, python=None, use_sudo=None, seconds=0):
                download_firmware()
                self.queue = queue.Queue(maxsize=32)
                self.metadata = None
                self.report = None
                self.error = None
                self.closed = False
                self.received_samples = 0
                self.output_samples = 0
                self.log = deque(maxlen=30)
                self.control_lock = threading.Lock()
                self.stop_sent = False
                self.ring_directory = tempfile.TemporaryDirectory(prefix='mt7961-ring-')
                self.ring_path = Path(self.ring_directory.name) / 'iq'
                self.ring_file = self.ring_path.open('w+b', buffering=0)
                self.ring_file.truncate(CHUNK_SAMPLES * 4 * 32)
                self.ring = mmap.mmap(self.ring_file.fileno(), CHUNK_SAMPLES * 4 * 32)
                self.started = time.monotonic()
                python = python or os.environ.get('SDR_WIFI_PYTHON') or sys.executable
                if not python:
                    raise RuntimeError('Set PYTHON to the Python 3.11+ interpreter selected in CyberEther')
                if use_sudo is None:
                    use_sudo = sys.platform.startswith('linux') and os.geteuid() != 0
                helper = worker_script(self.ring_directory.name)
                command = [python, '-E', '-B', '-u', str(helper), '--helper', '--firmware-dir', str(FIRMWARE_DIR), '--channel', str(channel), '--seconds', str(seconds), '--ring', str(self.ring_path)]
                package_paths = {str(Path(np.__file__).resolve().parent.parent)}
                try:
                    import usb
                    package_paths.add(str(Path(usb.__file__).resolve().parent.parent))
                except ImportError:
                    pass
                try:
                    import libusb_package
                    package_paths.add(str(Path(libusb_package.__file__).resolve().parent.parent))
                except ImportError:
                    pass
                for path in sorted(package_paths):
                    command += ['--python-path', path]
                if use_sudo:
                    command = ['sudo', '-n', *command]
                env = dict(os.environ, PYTHONDONTWRITEBYTECODE='1')
                self.process = subprocess.Popen(command, stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, bufsize=0, env=env)
                self.reader = threading.Thread(target=self._receive, name='mt7961-iq', daemon=True)
                self.logger = threading.Thread(target=self._logs, name='mt7961-log', daemon=True)
                self.logger.start()
                self.reader.start()
        
            def _logs(self):
                for line in iter(self.process.stderr.readline, b''):
                    text = line.decode(errors='replace').rstrip()
                    self.log.append(text)
                    print(text, flush=True)
        
            def _read_exact(self, size):
                parts = bytearray(size)
                view = memoryview(parts)
                position = 0
                while position < size:
                    count = self.process.stdout.readinto(view[position:])
                    if not count:
                        raise EOFError('Receiver helper closed its stream')
                    position += count
                return parts
        
            def _request_stop(self):
                with self.control_lock:
                    if not self.stop_sent:
                        self.stop_sent = True
                        try:
                            self.process.stdin.write(struct.pack('<Q', 18446744073709551615))
                        except (BrokenPipeError, OSError):
                            pass
        
            def _receive(self):
                frames = 0
                try:
                    while True:
                        kind, length, sample = FRAME.unpack(self._read_exact(FRAME.size))
                        if length > CHUNK_SAMPLES * 4 or length == 0:
                            raise RuntimeError('Invalid receiver frame length')
                        if kind == b'IQ14':
                            offset = frames % 32 * CHUNK_SAMPLES * 4
                            data = self.ring[offset:offset + length]
                            frames += 1
                            with self.control_lock:
                                self.process.stdin.write(struct.pack('<Q', frames))
                        else:
                            data = self._read_exact(length)
                        if kind == b'META':
                            if self.metadata is not None or self.received_samples:
                                raise RuntimeError('Unexpected receiver metadata')
                            self.metadata = json.loads(data)
                        elif kind == b'DONE':
                            self.report = json.loads(data)
                            if not self.report.get('complete'):
                                raise RuntimeError(self.report.get('error', 'Receiver integrity check failed'))
                            if self.report['delivered_samples'] != self.received_samples:
                                raise RuntimeError('Receiver sample count does not match delivered frames')
                            return
                        elif kind == b'IQ14':
                            if self.metadata is None or sample != self.received_samples or length % 16:
                                raise RuntimeError('Lost, duplicated or malformed receiver frame')
                            self.received_samples += length // 4
                            if not self.closed and self.error is None:
                                try:
                                    self.queue.put_nowait((sample, data))
                                except queue.Full:
                                    self.error = RuntimeError('CyberEther cannot keep up: I/Q queue full; reception stopped')
                                    self._request_stop()
                        else:
                            raise RuntimeError('Unknown receiver frame type')
                except Exception as exc:
                    self.error = self.error or exc
                    self._request_stop()
        
            def poll(self):
                if self.error:
                    raise RuntimeError(f'MT7961: {self.error}. ' + '\n'.join(self.log)) from self.error
                if self.metadata is None and time.monotonic() - self.started > 30:
                    self._request_stop()
                    raise RuntimeError('MT7961 startup timed out. ' + '\n'.join(self.log))
                try:
                    sample, raw = self.queue.get_nowait()
                except queue.Empty:
                    if self.report is not None and (not self.closed):
                        raise RuntimeError('MT7961 session ended; reload the Python source to restart')
                    return None
                if len(raw) != CHUNK_SAMPLES * 4:
                    return None
                iq = complex_samples(raw)
                self.output_samples += len(iq)
                return (sample, iq)
        
            def close(self):
                if self.closed:
                    return
                self.closed = True
                self._request_stop()
                self.reader.join(15)
                try:
                    self.process.wait(timeout=3)
                except subprocess.TimeoutExpired as exc:
                    raise RuntimeError('USB helper did not finish cleanup; leave its files intact') from exc
                self.logger.join(2)
                for stream in (self.process.stdout, self.process.stderr):
                    stream.close()
                self.process.stdin.close()
                if self.reader.is_alive():
                    raise RuntimeError('I/Q reader failed to stop')
                self.ring.close()
                self.ring_file.close()
                self.ring_directory.cleanup()
        
        _source = None
        
        
        def compute(ctx):
            global _source
            if _source is None:
                _source = Source(channel=CHANNEL, python=PYTHON, use_sudo=USE_SUDO)
            block = _source.poll()
            if block is None:
                time.sleep(0.001)  # Yield the CPU while the USB worker fills the next batch.
                return SKIP
            first_sample, iq = block
            ctx.outputs[0][...] = iq.reshape(ctx.outputs[0].shape)
            attrs = ctx.output_attrs[0]
            attrs['sampleRate'] = np.float32(_source.metadata['sample_rate_hz'])
            attrs['frequency'] = np.float32(_source.metadata['frequency_hz'])
            attrs['rfBandwidth'] = np.float32(20_000_000)
            attrs['firstSample'] = np.uint64(first_sample)
            attrs['captureBits'] = np.uint64(14)
            attrs['continuous'] = True
            attrs['sampleRateStatus'] = 'nominal; not externally calibrated'
            attrs['samplesDelivered'] = np.uint64(_source.output_samples)
        
        
        def cleanup():
            global _source
            if _source is not None:
                _source.close()
                _source = None
        
        
        if globals().get('__name__') == '__main__':
            if '--download-only' in sys.argv:
                print(download_firmware())
            elif '--helper' in sys.argv:
                raise SystemExit(main())
            else:
                print('Use this script in a CyberEther Python block, or run with --download-only.')
